name: Latest blog posts

# Pulls the latest posts from cangulo.github.io into the profile README,
# replacing the content between the BLOG-POST-LIST markers.

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://cangulo.github.io/blog/rss.xml"
          max_post_count: 5
